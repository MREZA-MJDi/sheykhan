<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Sheykhan learning background</title>
  <desc id="desc">A calm indigo educational background with abstract books and connected learning paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10182e"/>
      <stop offset=".55" stop-color="#263c70"/>
      <stop offset="1" stop-color="#4e5fca"/>
    </linearGradient>
    <radialGradient id="glow" cx=".76" cy=".28" r=".72">
      <stop offset="0" stop-color="#8cc8ff" stop-opacity=".3"/>
      <stop offset="1" stop-color="#8cc8ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="42" height="42" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.7" fill="#ffffff" opacity=".13"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
