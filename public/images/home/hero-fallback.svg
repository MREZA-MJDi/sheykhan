<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">فضای یادگیری آکادمی شیخان</title>
  <desc id="desc">فضایی پرانرژی با کتاب باز، مدارهای رنگی، نورهای بنفش و فیروزه‌ای و نشانه‌هایی از کنجکاوی و کشف.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1227"/>
      <stop offset=".38" stop-color="#202451"/>
      <stop offset=".72" stop-color="#343675"/>
      <stop offset="1" stop-color="#126f78"/>
    </linearGradient>
    <radialGradient id="violet" cx=".78" cy=".31" r=".72">
      <stop offset="0" stop-color="#a08bff" stop-opacity=".52"/>
      <stop offset=".58" stop-color="#766be9" stop-opacity=".14"/>
      <stop offset="1" stop-color="#766be9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx=".08" cy=".86" r=".65">
      <stop offset="0" stop-color="#5ee4c8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#5ee4c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leftPage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#cbdfff"/>
    </linearGradient>
    <linearGradient id="rightPage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1dc"/>
      <stop offset="1" stop-color="#d9d0ff"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a293ff"/>
      <stop offset="1" stop-color="#5648bd"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe7a9"/>
      <stop offset="1" stop-color="#f1a765"/>
    </linearGradient>
    <pattern id="stars" width="72" height="72" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="12" r="1.6" fill="#fff" opacity=".24"/>
      <circle cx="49" cy="48" r="1.2" fill="#9cf4e1" opacity=".32"/>
      <path d="M31 25v8m-4-4h8" stroke="#ffe1a2" stroke-linecap="round" opacity=".32"/>
    </pattern>
    <filter id="shadow" x="-35%" y="-35%" width="175%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="17"/>
      <feOffset dy="18"/>
      <feComponentTransfer><feFuncA type="linear" slope=".32"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#violet)"/>
  <rect width="1920" height="1080" fill="url(#teal)"/>
  <rect width="1920" height="1080" fill="url(#stars)"/>

  <g fill="none" stroke-linecap="round">
    <circle cx="1450" cy="470" r="400" stroke="#e0ddff" stroke-opacity=".15" stroke-width="2"/>
    <circle cx="1450" cy="470" r="320" stroke="#e0ddff" stroke-opacity=".17" stroke-width="2"/>
    <circle cx="1450" cy="470" r="243" stroke="#b9fff0" stroke-opacity=".22" stroke-width="3" stroke-dasharray="3 15"/>
    <path d="M1050 190c104-64 224-71 341-20s181 144 205 251" stroke="#b9fff0" stroke-opacity=".48" stroke-width="4"/>
    <path d="M1076 835c122-92 247-119 375-70s207 141 259 248" stroke="#ffd7a2" stroke-opacity=".4" stroke-width="4"/>
  </g>

