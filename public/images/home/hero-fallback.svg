    <path d="M298 52c100-64 203-69 306-11v315c-107-53-207-51-306 11Z" fill="url(#rightPage)" stroke="#fff" stroke-opacity=".78" stroke-width="3"/>
    <path d="M298 52v315" stroke="#8d80e0" stroke-opacity=".65" stroke-width="5"/>
    <path d="M34 92c72-26 148-20 218 3M34 130c72-24 148-19 218 4M34 168c72-21 148-17 218 5M34 206c72-17 148-15 218 6" fill="none" stroke="#818dd0" stroke-opacity=".69" stroke-width="8" stroke-linecap="round"/>
    <path d="M332 102c74-26 151-27 220-9M332 140c74-22 151-24 220-6M332 178c74-20 151-21 220-2M332 216c74-17 151-19 220-1" fill="none" stroke="#9a8ad9" stroke-opacity=".68" stroke-width="8" stroke-linecap="round"/>
    <path d="M49 267c64-12 129-6 201 8M332 267c70-12 146-9 207 6" fill="none" stroke="#24af9d" stroke-width="8" stroke-linecap="round"/>
    <path d="M49 300c63-7 130-2 201 10M332 300c70-7 145-5 207 7" fill="none" stroke="#e4ac61" stroke-opacity=".88" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g transform="translate(1576 205) rotate(24)" filter="url(#shadow)">
    <rect width="38" height="245" rx="12" fill="url(#gold)"/>
    <rect x="6" y="15" width="26" height="176" rx="8" fill="#fff2cf" fill-opacity=".72"/>
    <path d="M0 217 19 269 38 217Z" fill="#f2c7a1"/>
    <path d="m13 253 6 16 6-16Z" fill="#283054"/>
