  <g fill="#ffe0a2">
    <path d="M1060 205l10 21 23 3-17 15 5 22-21-12-21 12 5-22-17-15 23-3Z"/>
    <circle cx="1714" cy="642" r="7"/>
    <circle cx="1020" cy="788" r="5"/>
  </g>
  <g fill="none" stroke="#d6e4ff" stroke-width="3" stroke-linecap="round" opacity=".6">
    <path d="M1005 421v32m-16-16h32"/>
    <path d="M1750 812v30m-15-15h30"/>
  </g>

  <!-- Quiet center gradient preserves readable hero copy over the illustration. -->
  <rect x="360" y="0" width="920" height="1080" fill="#11162d" opacity=".14"/>
  <rect x="430" y="0" width="760" height="1080" fill="#11162d" opacity=".08"/>
</svg>